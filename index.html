<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zain eShop — UX Prototype</title>
<meta name="description" content="Clickable greyscale prototype of the Zain eShop landing page and product listing for three personas, desktop and mobile. Mock data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#212121;--ink2:#757575;--ink3:#9e9e9e;--line:#e0e0e0;--line2:#bdbdbd;--bg2:#f4f4f4;--bg3:#fafafa;--white:#fff;--bar:#141414;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:#e9e9e9;-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid #212121;outline-offset:2px}
svg{display:block}
/* ---------- demo toolbar ---------- */
#demo{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--bar);color:#fff;height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;font-size:13px}
#demo .t{font-weight:700;white-space:nowrap}
#demo .t small{display:block;font-weight:400;color:#aaa;font-size:11px}
#demo .grp{display:flex;align-items:center;gap:8px}
#demo .lbl{color:#9a9a9a;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:inline-flex;background:#2a2a2a;border-radius:20px;padding:3px}
.seg button{color:#ddd;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;white-space:nowrap}
.seg button.on{background:#fff;color:#111}
#demo .sp{flex:1}
#demo .note{color:#aaa;font-size:11px;max-width:300px;line-height:1.3}
#demo .reset{color:#ddd;text-decoration:underline;font-size:12px}
@media (max-width:1180px){#demo .note{display:none}}
@media (max-width:760px){#demo{height:auto;flex-wrap:wrap;padding:8px 12px;gap:8px}#demo .t small{display:none}#demo .vpg{display:none}#demo .sp{display:none}.seg button{padding:5px 9px;font-size:11px}}
/* ---------- stage / device ---------- */
#stage{padding-top:56px;min-height:100vh}
#device{position:relative;background:#fff}
.vp-m #stage{display:flex;justify-content:center;align-items:flex-start;padding:68px 16px 12px}
.vp-m #device{width:414px;height:min(868px,calc(100vh - 82px));min-height:560px;border:12px solid #111;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.vp-m #scroller{height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.vp-m #scroller::-webkit-scrollbar{display:none}
.vp-m #overlay{position:absolute;inset:0}
.vp-d #overlay{position:fixed;inset:56px 0 0 0}
#overlay{z-index:500;pointer-events:none;overflow:hidden}
.msearch .top .sbox{min-width:0;overflow:hidden}
.msearch .scope{flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.msearch .chips,#overlay .chips{flex-wrap:wrap!important;overflow:visible!important;margin:0!important;padding:0!important}
#overlay.open{pointer-events:auto}
.phone #stage{padding:0!important;display:block!important}
.phone #device{width:100%!important;height:auto!important;border:0!important;border-radius:0!important;box-shadow:none!important;overflow:visible!important}
.phone #scroller{height:auto!important;overflow:visible!important}
.phone #overlay{position:fixed!important;inset:0!important}
.phone #stage{padding-top:0!important}
.phone #demo{position:sticky}
.lock{overflow:hidden!important}
/* sticky header + search */
.dhead{position:sticky;top:56px;z-index:45;background:#fff}
.vp-d .entry{position:sticky;top:124px;z-index:44;background:#fff;padding:14px 0 12px;transition:box-shadow .15s}
.vp-d .entry.stuck{box-shadow:0 6px 12px -8px rgba(0,0,0,.18)}
.m .entry{position:sticky;top:56px;z-index:39;background:#fff;padding:10px 0}
.m .entry.stuck{box-shadow:0 6px 12px -8px rgba(0,0,0,.18)}
.entry2{text-align:center;padding:4px 0 6px}
.m .entry2{padding:0 0 4px}
.m .entry2 .chips{margin-top:4px}
.vp-d .plp-title{position:sticky;top:124px;z-index:44;background:#fff;padding:10px 0;margin-bottom:6px}
.phone #demo{position:static!important}
.phone .dhead{top:0}
/* ---------- layout ---------- */
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
.m .wrap{padding:0 16px}
.sec{padding:40px 0}
.m .sec{padding:28px 0}
.sec.alt{background:var(--bg3)}
.row{display:flex;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s}
.btn-p{background:var(--ink);color:#fff}
.btn-p:hover{background:#000}
.btn-o{border:1px solid var(--ink);background:#fff}
.btn-o:hover{background:var(--bg2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lnk{text-decoration:underline;font-weight:600;font-size:14px}
.muted{color:var(--ink2)}
.ph{background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink3);position:relative}
.ph svg{opacity:.55}
/* ---------- header ---------- */
.util{background:var(--bg2);font-size:12px;color:var(--ink2)}
.util .wrap{height:32px;justify-content:space-between}
.mainbar{border-bottom:1px solid var(--line);background:#fff}
.mainbar .wrap{height:68px;gap:28px}
.logo{background:var(--bg2);border:1px solid var(--line);color:var(--ink2);font-size:12px;padding:9px 14px;border-radius:4px;white-space:nowrap}
.nav{display:flex;gap:26px;font-size:15px}
.nav a.on{font-weight:700}
.hright{margin-left:auto;display:flex;align-items:center;gap:22px;font-size:14px;color:var(--ink2)}
.hright .hl{cursor:pointer}
.acct{border:1px solid var(--ink);border-radius:var(--r);padding:8px 14px;color:var(--ink);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.linechip{border:1px solid var(--ink);border-radius:18px;padding:6px 12px;color:var(--ink);font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.mhead{height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:40}
.mhead .ic{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.mhead .grow{flex:1}
/* ---------- shop entry ---------- */
.entry{padding:28px 0 8px;text-align:center}
.m .entry{padding:16px 0 4px}
.sfield{position:relative;max-width:720px;margin:0 auto}
.sbox{display:flex;align-items:center;gap:10px;height:52px;border:1px solid var(--line2);border-radius:28px;padding:0 20px;background:#fff}
.sbox input{border:0;outline:0;flex:1;font-size:16px;background:transparent;min-width:0}
.sbox:focus-within{border-color:var(--ink)}
.m .sbox{height:48px;padding:0 16px}
.help{margin-top:14px;font-size:13px;color:var(--ink2)}
.help a{margin:0 6px;cursor:pointer}
.chips{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.m .chips{flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.m .chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line2);border-radius:20px;padding:8px 16px;font-size:14px;white-space:nowrap;background:#fff;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:hover{border-color:var(--ink)}
/* autocomplete */
.ac{position:absolute;left:0;right:0;top:60px;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.18);z-index:60;text-align:left;padding:20px 24px;max-height:70vh;overflow:auto}
.ac-h{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase;margin:4px 0 10px}
.ac-dev{margin-bottom:16px}
.ac-dh{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.ac-dh .ph{width:48px;height:48px;border-radius:6px}
.ac-dh b{font-weight:600;font-size:15px}
.ac-dh span{display:block;font-size:12px;color:var(--ink2)}
.ac-rows{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ac-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer}
.ac-row:first-child{border-top:0}
.ac-row:hover,.ac-row.hi{background:var(--bg2)}
.ac-row .l{flex:1;min-width:0}
.ac-row .l b{font-size:13px;font-weight:600;display:block}
.ac-row .l small{font-size:11px;color:var(--ink2)}
.ac-row .r{font-weight:600;font-size:13px;white-space:nowrap}
.ac-acc{display:flex;gap:12px;align-items:center;padding:8px 6px;border-radius:8px;cursor:pointer}
.ac-acc:hover,.ac-acc.hi{background:var(--bg2)}
.ac-acc .ph{width:44px;height:44px;border-radius:6px;flex:none}
.ac-acc .l{flex:1;min-width:0;font-size:13px}
.ac-acc .l small{display:block;color:var(--ink2);font-size:11px}
.ac-acc .r{text-align:right;font-weight:600;font-size:13px;white-space:nowrap}
.ac-acc .r small{display:block;font-weight:400;color:var(--ink2);font-size:11px}
.ac-foot{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.ac-empty{padding:8px 0}
.ac mark,.msearch mark{background:none;font-weight:700;color:inherit}
/* ---------- hero ---------- */
.hero{display:flex;gap:16px;align-items:stretch}
.m .hero{flex-direction:column}
.hb{flex:2.15;min-width:0;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);overflow:hidden;position:relative}
.htrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;height:100%}
.htrack::-webkit-scrollbar{display:none}
.hslide{flex:0 0 100%;scroll-snap-align:start;display:flex;gap:28px;align-items:center;padding:40px;min-height:340px}
.m .hslide{flex-direction:column-reverse;align-items:stretch;padding:20px;gap:16px;min-height:0}
.hcopy{flex:1;min-width:0}
.kick{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}
.hcopy h1{font-size:34px;line-height:1.15;margin:12px 0;font-weight:700}
.m .hcopy h1{font-size:26px}
.hcopy p{color:var(--ink2);font-size:16px}
.hbtns{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}
.m .hbtns{flex-direction:column}
.m .hbtns .btn{width:100%}
.helig{font-size:13px;color:var(--ink2);margin-top:14px}
.himg{flex:0 0 42%;height:260px;border-radius:6px}
.m .himg{flex:none;height:180px}
.hdots{position:absolute;left:40px;bottom:18px;display:flex;gap:8px}
.m .hdots{position:static;justify-content:center;padding:0 0 18px}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--line2);cursor:pointer;padding:0}
.dot.on{background:var(--ink);border-color:var(--ink)}
.tiles{flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
.tile{flex:1;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.m .tile{padding:18px 20px}
.tile h3{font-size:18px;font-weight:600;line-height:1.3}
.tag{display:inline-flex;align-self:flex-start;gap:6px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:4px;text-transform:uppercase}
.tile .sub{font-size:13px;color:var(--ink2)}
/* ---------- section heading ---------- */
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px}
.sh h2{font-size:28px;font-weight:700;line-height:1.2}
.sh h2 span{color:var(--ink2);font-weight:400}
.m .sh{margin-bottom:16px;flex-wrap:wrap;row-gap:6px}
.m .sh h2{font-size:20px}
.m .sh p{color:var(--ink2);font-size:15px}
.sh .lnk{flex:none}
/* ---------- carousels ---------- */
.car{position:relative}
.ctrack{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;padding:2px 2px 4px;margin:0 -2px;cursor:grab}
.ctrack.drag{cursor:grabbing;scroll-snap-type:none}
.ctrack::-webkit-scrollbar{display:none}
.ctrack>*{scroll-snap-align:start}
.m .ctrack{gap:12px;margin:0 -16px;padding:2px 16px 4px;scroll-padding:0 16px}
.cprev,.cnext{position:absolute;top:calc(50% - 40px);width:48px;height:48px;border-radius:50%;border:1px solid var(--line2);background:#fff;display:flex;align-items:center;justify-content:center;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.cprev{left:-64px}
.cnext{right:-20px}
.cprev[hidden],.cnext[hidden]{display:none}
.m .cprev,.m .cnext{display:none}
.fade{position:absolute;top:0;right:-40px;width:180px;bottom:30px;background:linear-gradient(90deg,rgba(255,255,255,0),#fff);pointer-events:none}
.sec.alt .fade{background:linear-gradient(90deg,rgba(250,250,250,0),#fafafa)}
.m .fade{display:none}
.cdots{display:flex;gap:8px;justify-content:center;margin-top:18px}
.cdots .dot{width:8px;height:8px}
@media (max-width:1400px){.vp-d .cprev{left:-10px}}
/* tabs */
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.m .tabs{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px 16px;padding:0 16px;scrollbar-width:none}
.m .tabs::-webkit-scrollbar{display:none}
/* line bar */
.linebar{display:inline-flex;flex-direction:column;gap:2px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 14px;margin-bottom:16px;font-size:13px}
.d .linebar{flex-direction:row;gap:16px;align-items:center}
.linebar button{font-weight:600;display:inline-flex;gap:4px;align-items:center}
/* ---------- product card ---------- */
.card{border:1px solid var(--line2);border-radius:var(--r);background:#fff;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.ctrack .card,.ctrack .lead{flex:0 0 286px}
.m .ctrack .card,.m .ctrack .lead{flex:0 0 280px}
.cimg{height:170px;border-radius:4px;margin-bottom:4px}
.badge{position:absolute;top:10px;left:10px;border:1px solid var(--ink);background:#fff;border-radius:4px;font-size:11px;font-weight:600;padding:2px 7px;color:var(--ink)}
.cbrand{font-size:11px;color:var(--ink2);text-transform:uppercase;letter-spacing:.03em}
.cname{font-size:16px;font-weight:600;line-height:1.3}
.cname:hover{text-decoration:underline}
.cdiv{height:1px;background:var(--line);margin:2px 0}
.meth{font-size:12px;font-weight:600}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price b{font-size:24px;font-weight:700;line-height:1.15}
.price span{font-size:14px;color:var(--ink2)}
.term{font-size:12px;color:var(--ink2)}
.note{font-size:12px;color:var(--ink2);margin-top:4px}
.secs p{font-size:12px;padding:8px 0;border-top:1px solid var(--line);line-height:1.4}
.secs p:first-child{border-top:1px solid var(--line)}
.ways{display:flex;justify-content:space-between;align-items:center;width:100%;border-top:1px solid var(--line);padding:10px 0 2px;font-weight:600;font-size:13px;text-align:left;min-height:40px}
.ways svg{transition:transform .2s}
.ways[aria-expanded="true"] svg{transform:rotate(180deg)}
.spacer{flex:1;min-height:4px}
.cta{width:100%;margin-top:4px}
.soon{font-weight:600;font-size:15px}
.oosp .meth,.oosp .price b,.oosp .price span,.oosp .term{color:#9e9e9e}
.field{display:flex;flex-direction:column;gap:6px;margin:16px 0}
.field label{font-size:13px;font-weight:600}
.field input{height:48px;border:1px solid var(--line2);border-radius:8px;padding:0 14px;font-size:15px;outline:0}
.field input:focus{border-color:var(--ink)}
.field input.err{border-color:#b00020}
.field .err-t{font-size:12px;color:#b00020}
.field small{font-size:12px;color:var(--ink2)}
.nprod{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.nprod .ph{width:56px;height:56px;border-radius:6px;flex:none}
.nprod small{display:block;color:var(--ink2);font-size:12px}
/* compact grid card (mobile 2-col) */
.cards.grid2 .card{padding:12px;gap:6px}
.cards.grid2 .cimg{height:150px}
.cards.grid2 .price b{font-size:15px}
.cards.grid2 .price span{font-size:12px}
.cards.grid2 .meth{font-size:11px}
.cards.grid2 .cname{font-size:15px}
.cards.grid2 .ways{font-size:12px}
.cards.grid2 .cta{height:40px;font-size:13px;padding:0 8px}
/* lead tile */
.lead{border:1px solid var(--line2);border-radius:var(--r);background:var(--bg2);padding:20px;display:flex;flex-direction:column;gap:12px}
.lead .ph{flex:1;min-height:200px;border-radius:8px;background:#e6e6e6}
.lead h3{font-size:22px;font-weight:700}
.lead p{color:var(--ink2);font-size:14px}
.leadm{display:flex;gap:14px;align-items:center;border:1px solid var(--line2);border-radius:var(--r);background:var(--bg2);padding:14px;margin-bottom:12px}
.leadm .ph{width:88px;height:88px;border-radius:8px;flex:none;background:#e6e6e6}
.leadm h3{font-size:17px;font-weight:700}
.leadm p{font-size:13px;color:var(--ink2);margin:2px 0 4px}
/* category / brand tiles */
.ctiles{display:grid;grid-template-columns:repeat(9,1fr);gap:16px}
.ctile{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;cursor:pointer}
.ctile .ph{width:100%;aspect-ratio:4/3;border-radius:6px}
.ctile span{font-size:14px}
.ctile:hover span{text-decoration:underline}
.m .ctiles{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.m .ctiles::-webkit-scrollbar{display:none}
.m .ctile{flex:0 0 76px;gap:6px}
.m .ctile .ph{aspect-ratio:auto;height:64px}
.m .ctile span{font-size:11px}
.btiles{display:flex;gap:12px;flex-wrap:wrap}
.btile{border:1px solid var(--line2);border-radius:var(--r);height:64px;flex:1 1 120px;display:flex;align-items:center;justify-content:center;font-weight:600;cursor:pointer;background:#fff}
.btile:hover{border-color:var(--ink)}
.m .btiles{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px;scrollbar-width:none}
.m .btiles::-webkit-scrollbar{display:none}
.m .btile{flex:0 0 120px;height:56px}
/* ways to buy cards */
.wtb{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.wcard{border:1px solid var(--line2);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:8px;background:#fff}
.wcard h3{font-size:18px;font-weight:600}
.wcard p{color:var(--ink2);font-size:13px;flex:1}
.wbadge{align-self:flex-start;border:1px solid var(--line2);background:var(--bg2);border-radius:4px;padding:2px 8px;font-size:12px}
.wcard .lnk{font-size:13px}
.m .wtb{display:flex;overflow-x:auto;margin:0 -16px;padding:0 16px;gap:12px;scroll-snap-type:x proximity;scrollbar-width:none}
.m .wtb::-webkit-scrollbar{display:none}
.m .wcard{flex:0 0 260px;scroll-snap-align:start}
/* gift cards */
.gcard{border:1px solid var(--line2);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff}
.ctrack .gcard{flex:0 0 240px}
.gcard .ph{height:130px;border-radius:6px}
.gcard h3{font-size:16px;font-weight:600}
/* home internet */
.hfi{border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;gap:40px;padding:32px}
.m .hfi{flex-direction:column;gap:20px;padding:20px 16px}
.hfi-dev{flex:0 0 380px;display:flex;flex-direction:column;gap:10px}
.m .hfi-dev{flex:none}
.hfi-dev .ph{height:220px;border-radius:8px}
.hfi-small{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink2)}
.hfi-name{font-size:22px;font-weight:700}
.m .hfi-name{font-size:17px}
.ben{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:6px;font-size:13px}
.ben li::before{content:"✓  ";}
.devrow{display:flex;gap:12px;align-items:center}
.devrow .ph{width:96px;height:96px;flex:none}
.feat-t{display:flex;justify-content:space-between;align-items:center;width:100%;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 0;font-weight:600;font-size:13px}

/* carousels */
function initCarousels(saved){
 document.querySelectorAll(".car").forEach(c=>{
  const t=c.querySelector(".ctrack");if(!t)return;const dots=c.querySelector(".cdots");const prev=c.querySelector(".cprev");
  if(saved[t.dataset.ck]!=null)t.scrollLeft=saved[t.dataset.ck];
  const pages=()=>Math.max(1,Math.ceil((t.scrollWidth-4)/t.clientWidth));
  const build=()=>{if(!dots)return;const n=pages();dots.innerHTML=n>1?Array.from({length:n},(_,i)=>`<button class="dot" aria-label="Page ${i+1}" data-i="${i}"></button>`).join(""):"";upd();};
  const upd=()=>{const n=pages();const i=Math.round(t.scrollLeft/Math.max(1,(t.scrollWidth-t.clientWidth))*(n-1))||0;dots&&dots.querySelectorAll(".dot").forEach((d,j)=>d.classList.toggle("on",j===i));if(prev)prev.hidden=t.scrollLeft<8;const f=c.querySelector(".fade");if(f)f.style.opacity=t.scrollLeft>=t.scrollWidth-t.clientWidth-8?0:1;};
  t.addEventListener("scroll",upd,{passive:true});
  dots&&dots.addEventListener("click",e=>{const d=e.target.closest(".dot");if(!d)return;const n=pages();t.scrollTo({left:(t.scrollWidth-t.clientWidth)*(+d.dataset.i/(n-1||1)),behavior:"smooth"});});
  if(prev)prev.onclick=()=>t.scrollBy({left:-t.clientWidth*.8,behavior:"smooth"});
  // mouse drag (desktop)
  let down=false,sx=0,sl=0,moved=false;
  t.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;down=true;moved=false;sx=e.clientX;sl=t.scrollLeft;});
  t.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>5){moved=true;t.classList.add("drag");}t.scrollLeft=sl-dx;});
  const up=()=>{if(!down)return;down=false;setTimeout(()=>t.classList.remove("drag"),0);};
  t.addEventListener("pointerup",up);t.addEventListener("pointerleave",up);
  t.addEventListener("click",e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false;}},true);
  requestAnimationFrame(build);
 });
 // plans dots (mobile hfi)
 const pl=document.querySelector(".m .plans");if(pl){const ds=pl.parentElement.querySelectorAll(".cdots .dot");pl.addEventListener("scroll",()=>{const i=Math.round(pl.scrollLeft/252);ds.forEach((d,j)=>d.classList.toggle("on",j===i));},{passive:true});}
}
function initHero(){
 const t=document.querySelector("[data-hero]");if(!t)return;const dots=t.parentElement.querySelectorAll(".hdots .dot");
 t.addEventListener("scroll",()=>{const i=Math.round(t.scrollLeft/t.clientWidth);dots.forEach((d,j)=>d.classList.toggle("on",j===i));},{passive:true});
 let down=false,sx=0,sl=0,moved=false;
 t.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;down=true;moved=false;sx=e.clientX;sl=t.scrollLeft;t.style.scrollSnapType="none";});
 t.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>5)moved=true;t.scrollLeft=sl-dx;});
 const up=()=>{if(!down)return;down=false;t.style.scrollSnapType="";const i=Math.round(t.scrollLeft/t.clientWidth);t.scrollTo({left:i*t.clientWidth,behavior:"smooth"});};
 t.addEventListener("pointerup",up);t.addEventListener("pointerleave",up);
 t.addEventListener("click",e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false;}},true);
}
/* desktop autocomplete binding */
function bindSearch(){
 const pairs=[["q-home","ac-home",null],["q-plp","ac-plp","plp"]];
 for(const [iid,aid,kind] of pairs){
  const inp=document.getElementById(iid),ac=document.getElementById(aid);if(!inp||!ac||isM())continue;
  const scope=()=>{if(kind!=="plp")return null;const pr=params(route().q);return(pr.brand.length||pr.category.length)?{brand:pr.brand,category:pr.category}:null;};
  const show=()=>{const v=inp.value;const h=acHTML(v,scope());ac.innerHTML=h;ac.hidden=!h;S.acIdx=-1;};
  inp.addEventListener("input",show);inp.addEventListener("focus",()=>{if(inp.value)show();});
  inp.addEventListener("keydown",e=>{
   const items=[...ac.querySelectorAll("[data-i]")];
   if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!items.length)return;S.acIdx=(S.acIdx+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;items.forEach((x,j)=>x.classList.toggle("hi",j===S.acIdx));items[S.acIdx].scrollIntoView({block:"nearest"});}
   else if(e.key==="Enter"){e.preventDefault();if(S.acIdx>=0&&items[S.acIdx]){const it=items[S.acIdx];if(it.dataset.a==="notify"){A.notify(it);return;}go(it.getAttribute("href"));return;}const v=inp.value.trim();if(kind==="plp"){const pr=params(route().q);pr.q=v;pr.sort=v?"relevance":"recommended";go(toQS(pr));}else if(v)go(`#/shop?q=${encodeURIComponent(v)}&sort=relevance`);}
   else if(e.key==="Escape"){ac.hidden=true;inp.blur();}
  });
 }
}

 const content=`${ph("campaign",0,"zp-ill")}<p class="zp-intro">Keep your plan and add the latest devices with easy monthly installments.</p><div class="steps">${steps.map((s,i)=>`<div class="step"><span class="n">${i+1}</span><div><b>${s[0]}</b><p>${s[1]}</p></div></div>`).join("")}</div><div class="facts">${facts.map(f=>`<div class="fact"><b>${f[0]}</b><span class="muted">${f[1]}</span></div>`).join("")}</div>${elig?`<div class="eligban">✓ You’re eligible for Zain Plus on line ${curLine().num}.</div>`:""}`;
 const act=`<div class="mact"><a class="lnk" style="font-weight:400" href="#/stub/Zain%20Plus%20FAQs" data-a="close-nav">Read Zain Plus FAQs →</a>${S.persona==="A"?`<button class="btn btn-p" data-a="login">Log in to check your eligibility</button>`:elig?`<a class="btn btn-p" href="#/shop?method=zainplus" data-a="close-nav">Shop with Zain Plus</a>`:`<button class="btn btn-p" data-a="setline" data-l="1212">Switch to an eligible line</button>`}</div>`;
 if(mob)return`<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="How Zain Plus works"><div class="grab"></div><div class="shd"><h2>How Zain Plus works</h2><button class="xbtn" data-a="close" aria-label="Close">${IC.x}</button></div><div class="sbd">${content}${act}</div></div>`;
 return`<div class="scrim" data-a="close"></div><div class="modal" role="dialog" aria-modal="true" aria-label="How Zain Plus works"><div class="mhd"><h2>How Zain Plus works</h2><button class="xbtn" data-a="close" aria-label="Close">${IC.x}</button></div>${content}${act}</div>`;
}
function mSearch(o){
 const pr=o.scope?params(route().q):null;const sc=pr&&(pr.brand.length||pr.category.length)?{brand:pr.brand,category:pr.category}:null;
 const v=o.v||"";
 const res=v.length>=2?acHTML(v,sc):`<div class="muted" style="font-size:13px">Type at least 2 characters.</div><div class="ac-h" style="margin-top:20px">Popular categories</div><div class="chips" style="justify-content:flex-start;flex-wrap:wrap;margin:0">${CATS.slice(0,6).map(([s,n])=>`<a class="chip" href="#/shop?category=${s}" data-a="close-nav">${n}</a>`).join("")}</div>`;
 return`<div class="msearch" role="dialog" aria-modal="true" aria-label="Search"><div class="top"><button class="xbtn" style="background:none" data-a="close" aria-label="Back">${IC.back}</button><label class="sbox"><span class="muted">${IC.search}</span>${sc&&o.keepScope!==false?`<span class="scope">in ${esc(scopeLabel(pr))} <button data-a="msunscope" aria-label="Search all">${IC.xs}</button></span>`:""}<input id="ms-in" type="search" placeholder="${sc?"Search in results…":"Search phones, tablets, accessories…"}" value="${esc(v)}" autocomplete="off" aria-label="Search">${v?`<button data-a="msclear" aria-label="Clear">${IC.xs}</button>`:""}</label></div><div class="res" id="ms-res">${res}</div></div>`;
}
function fSheet(o){
 const pr=o.draft;const b=priceBasisOf(pr);const total=filt(pr).length;const isPrice=pr.sort.startsWith("price");
 const sorts=[["recommended","Recommended"],...(pr.q?[["relevance","Relevance"]]:[]),["newest","Newest"],["price-asc","Price: low to high"],["price-desc","Price: high to low"]];
 const sortH=`<div class="fsh">Sort by</div>${sorts.map(([v,l])=>`<button class="sorto ${pr.sort===v?"on":""}" data-a="dsort" data-v="${v}"><span class="radio ${pr.sort===v?"on":""}"></span>${l}</button>`).join("")}
 ${isPrice?`<div class="fsh" style="margin-top:14px;font-size:14px">Price basis</div><div class="bseg">${bases().map(x=>`<button class="${(pr.basis||defaultBasis())===x?"on":""}" data-a="dbasis" data-v="${x}">${MLAB[x]}</button>`).join("")}</div><p class="fhint">Monthly prices compare at 24 months commitment. Products without the selected way to buy are listed after a divider.</p>`:`<p class="fhint">Choosing a price sort shows the price basis (way to buy) to compare.</p>`}`;
 return`<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Filter and sort"><div class="grab"></div><div class="shd"><h2>Filter & sort</h2><button class="lnk" data-a="dreset">Reset</button><button class="xbtn" style="background:none" data-a="close" aria-label="Close">${IC.x}</button></div><div class="sbd">${sortH}<div style="height:1px;background:#e0e0e0;margin:16px 0"></div><div class="fsh">Filters</div>${railHTML(pr,"d")}</div><div class="sft"><button class="btn btn-p" data-a="dapply">Show ${total} result${total===1?"":"s"}</button></div></div>`;
}
/* notify form */
ov.addEventListener("submit",e=>{const f=e.target;if(f.dataset.form!=="notify")return;e.preventDefault();const v=document.getElementById("n-email").value.trim();S.ov.email=v;if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){S.ov.err=true;renderOverlay();return;}S.ov.err=false;S.ov.done=true;renderOverlay();});
/* overlay input events */
ov.addEventListener("input",e=>{
 if(e.target.id==="ms-in"){S.ov.v=e.target.value;const pr=S.ov.scope?params(route().q):null;const sc=pr&&(pr.brand.length||pr.category.length)&&S.ov.keepScope!==false?{brand:pr.brand,category:pr.category}:null;document.getElementById("ms-res").innerHTML=e.target.value.length>=2?acHTML(e.target.value,sc):`<div class="muted" style="font-size:13px">Type at least 2 characters.</div>`;}
});
ov.addEventListener("keydown",e=>{
 if(e.target.id==="ms-in"&&e.key==="Enter"){const v=e.target.value.trim();if(!v)return;let h;if(S.ov.scope&&S.ov.keepScope!==false){const pr=params(route().q);pr.q=v;pr.sort="relevance";h=toQS(pr);}else h=`#/shop?q=${encodeURIComponent(v)}&sort=relevance`;S.ov=null;go(h);}
});
ov.addEventListener("change",e=>{
 const pr=e.target.dataset.pr;if(pr&&S.ov&&S.ov.t==="fsheet"){S.ov.draft[pr]=+e.target.value||0;renderOverlay();}
});
/* ======================= ACTIONS ======================= */
const A={
 ways(el){const k=el.dataset.k;S.exp.has(k)?S.exp.delete(k):S.exp.add(k);render(true);},
 tab(el){S.tabs=S.tabs||{};S.tabs[el.dataset.g]=el.dataset.v;render(true);},
 hdot(el){const t=document.querySelector("[data-hero]");t.scrollTo({left:t.clientWidth*+el.dataset.i,behavior:"smooth"});},
 zp(){openOv({t:"zp"});},
 login(){openOv({t:"login"});},
 as(el){S.persona=el.dataset.p;S.line="1212";S.ov=null;syncDemo();render(true);toast(el.dataset.p==="C"?"Logged in — Zain Plus eligible on line 5000 1212":"Logged in — offers for your line");},
 logout(){S.persona="A";S.ov=null;syncDemo();render(true);toast("Logged out — guest view");},
 lines(){openOv({t:"lines"});},
 acct(){openOv({t:"acct"});},
 setline(el){S.line=el.dataset.l;S.ov=null;render(true);toast("Showing offers for line "+curLine().num);},
 drawer(){openOv({t:"drawer"});},
 close(){closeOv();},
 "close-nav"(){S.ov=null;renderOverlay();},
 toast(el){toast(el.dataset.t);},
 scrollto(el){const t=document.getElementById(el.dataset.t);if(t){const se=scrollEl();const top=t.getBoundingClientRect().top-(se===scroller?scroller.getBoundingClientRect().top:0)+se.scrollTop-70;se.scrollTo({top,behavior:"smooth"});}},
 "focus-search"(){const i=document.getElementById("q-plp")||document.getElementById("q-home");if(i){i.focus();i.scrollIntoView({block:"center",behavior:"smooth"});}else go("#/");},
 feat(){S.hfi.feat=!S.hfi.feat;render(true);},
 hplan(el){S.hfi.plan=el.dataset.v;render(true);},
 hdur(el){S.hfi.dur=+el.dataset.v;render(true);},
 hcare(el){S.hfi.care=el.dataset.v;render(true);},
 more(){S.shown+=isM()?6:9;render(true);},
 view(el){S.view=el.dataset.v;try{sessionStorage.setItem("zs-view",S.view);}catch(e){}render(true);},
 sortmenu(){S.menu=S.menu==="sort"?null:"sort";render(true);},
 sort(el){const pr=params(route().q);pr.sort=el.dataset.v;pr.basis=el.dataset.b||"";S.menu=null;go(toQS(pr));},
 f(el){const pr=params(route().q);applyFacet(pr,el.dataset.k,el.dataset.v);go(toQS(pr));},
 unscope(el,e){e.preventDefault();const pr=params(route().q);const q=document.getElementById("q-plp").value.trim();go(q?`#/shop?q=${encodeURIComponent(q)}&sort=relevance`:"#/shop");},
 msearch(el){openOv({t:"msearch",v:"",scope:!!el.dataset.scope});},
 msunscope(el,e){e.preventDefault();S.ov.keepScope=false;renderOverlay();},
 msclear(el,e){e.preventDefault();S.ov.v="";renderOverlay();},
 fsheet(){openOv({t:"fsheet",draft:params(route().q)});},
 df(el){applyFacet(S.ov.draft,el.dataset.k,el.dataset.v);renderOverlay();},
 dsort(el){const d=S.ov.draft;d.sort=el.dataset.v;if(!d.sort.startsWith("price"))d.basis="";else if(!d.basis)d.basis=defaultBasis();renderOverlay();},
 dbasis(el){S.ov.draft.basis=el.dataset.v;renderOverlay();},
 dreset(){const pr=params(route().q);const ctx=context(pr);const n={brand:ctx==="brand"?pr.brand:[],category:(ctx==="category"||ctx==="combined")&&pr.category.length?[pr.category[0]]:[],method:"",q:ctx==="search"?pr.q:"",sort:pr.q?"relevance":"recommended",basis:"",pmin:0,pmax:0,avail:[],collection:pr.collection};S.ov.draft=n;renderOverlay();},
 dapply(){const h=toQS(S.ov.draft);S.ov=null;go(h);},
 notify(el){openOv({t:"notify",id:el.dataset.id,email:loggedIn()?ACCOUNT_EMAIL:""});},

};
function applyFacet(pr,k,v){if(k==="method"){pr.method=pr.method===v?"":v;pr.pmin=pr.pmax=0;}else{const a=pr[k];const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);}}
document.addEventListener("click",e=>{const st=e.target.closest('a[href^="#/stub/"]');if(st){e.preventDefault();e.stopPropagation();if(S.ov&&S.ov.t==="drawer"){S.ov=null;}toast(stubMsg(st.getAttribute("href")));document.querySelectorAll(".ac").forEach(x=>x.hidden=true);return;}const a=e.target.closest('a[href^="#/p/"]');if(a){e.preventDefault();e.stopPropagation();if(a.closest("#overlay")&&S.ov&&S.ov.t==="msearch"){}toast(NOPDP);document.querySelectorAll(".ac").forEach(x=>x.hidden=true);}},true);
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-a]");if(!el)return;
 const a=el.dataset.a;if(!A[a])return;
 if(el.tagName==="INPUT")return;// checkbox handled on change
 if(a==="close-nav"){A[a](el,e);return;}
 if(el.tagName==="A"&&el.getAttribute("href")&&!el.getAttribute("href").startsWith("javascript"))return;
 e.preventDefault();A[a](el,e);
});
document.addEventListener("change",e=>{const el=e.target;if(el.tagName==="INPUT"&&el.dataset.a&&A[el.dataset.a])A[el.dataset.a](el,e);});
// desktop price inputs
document.addEventListener("change",e=>{const el=e.target;if(el.dataset.pr&&!el.closest("#overlay")){const pr=params(route().q);pr[el.dataset.pr]=+el.value||0;go(toQS(pr));}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(S.ov)closeOv();else if(S.menu){S.menu=null;render(true);}}});
// close overlays when navigating via links inside
ov.addEventListener("click",e=>{const a=e.target.closest("a[href^='#']");if(a){S.ov=null;}});
let tt;function toast(m){S.toast=m;renderOverlay();clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;renderOverlay();},2600);}
window.addEventListener("hashchange",()=>{S.menu=null;if(S.ov&&S.ov.t!=="msearch")S.ov=null;else S.ov=null;render(false);});
/* ======================= DEMO TOOLBAR ======================= */
function syncDemo(){
 document.querySelectorAll("#pseg button").forEach(b=>b.classList.toggle("on",b.dataset.p===S.persona));
 document.querySelectorAll("#vseg button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.vp));
 document.body.classList.toggle("vp-m",S.vp==="m");document.body.classList.toggle("vp-d",S.vp!=="m");
 try{sessionStorage.setItem("zs-state",JSON.stringify({persona:S.persona,vp:S.vp,line:S.line}));}catch(e){}
}
$("#pseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.persona=b.dataset.p;S.line="1212";S.ov=null;syncDemo();render(true);toast({A:"Guest view",B:"Logged in · not Zain Plus eligible",C:"Zain Plus eligible · line 5000 1212"}[S.persona]);});
$("#vseg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.vp=b.dataset.v;S.ov=null;S.lastKey="";syncDemo();render(false);});
$("#resetbtn").addEventListener("click",()=>{try{sessionStorage.clear();}catch(e){}S.persona="A";S.line="1212";S.exp.clear();S.view="list";S.hfi={dur:24,plan:"f15",care:"none",feat:false};S.tabs={};S.ov=null;syncDemo();location.hash="#/";render(false);});
function checkPhone(){const ph=window.innerWidth<700;document.body.classList.toggle("phone",ph);if(ph&&S.vp!=="m"){S.vp="m";syncDemo();render(true);}}
window.addEventListener("resize",checkPhone);
function onScr(){const e=document.querySelector(".entry");if(e)e.classList.toggle("stuck",scrollEl().scrollTop>60);}
window.addEventListener("scroll",onScr,{passive:true});scroller.addEventListener("scroll",onScr,{passive:true});
try{const st=JSON.parse(sessionStorage.getItem("zs-state")||"null");if(st){S.persona=st.persona||"A";S.vp=st.vp||"d";S.line=st.line||"1212";}S.view=sessionStorage.getItem("zs-view")||"list";}catch(e){}
const up=new URLSearchParams(location.search);if(up.get("persona"))S.persona=up.get("persona").toUpperCase();if(up.get("view"))S.vp=up.get("view")==="mobile"?"m":"d";
syncDemo();checkPhone();render(false);
})();
</script>
